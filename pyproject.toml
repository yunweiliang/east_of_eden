[project]
name = "eden"
version = "0.1.0"
description = "An agent that dissects East of Eden into a cause-and-effect plot graph"
requires-python = ">=3.10"
dependencies = ["anthropic>=1.13", "pydantic>=2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["eden"]

[tool.pytest.ini_options]
testpaths = ["tests"]
