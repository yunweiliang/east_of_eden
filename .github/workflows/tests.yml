name: tests

# Runs the unit tests on every pull request and on every push to main.
# The tests use a fake client, so this workflow makes no model calls, needs no API key, and uses no secrets.
# Evals that call the real model are run by hand and are not part of this workflow.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the package and test tools
        run: pip install -e '.[dev]'

      - name: Run the unit tests
        run: pytest -q
